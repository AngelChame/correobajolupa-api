name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secretos:
    name: Escáner de secretos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Para cuentas personales no hace falta licencia; si el repo pasa a una organización, sí.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  node:
    name: Node (tipos, pruebas, auditoría)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: ¿Ya hay un proyecto de Node?
        id: detectar
        run: |
          if [ -f package.json ]; then
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            echo "hay=false" >> "$GITHUB_OUTPUT"
            echo "Todavía no hay package.json; se omiten los pasos de Node."
          fi
      - uses: actions/setup-node@v6
        if: steps.detectar.outputs.hay == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias
        if: steps.detectar.outputs.hay == 'true'
        run: npm ci
      - name: Estilo
        if: steps.detectar.outputs.hay == 'true'
        run: npm run lint --if-present
      - name: Tipos
        if: steps.detectar.outputs.hay == 'true'
        run: npm run typecheck --if-present
      - name: Compilar
        if: steps.detectar.outputs.hay == 'true'
        run: npm run build --if-present
      - name: Pruebas
        if: steps.detectar.outputs.hay == 'true'
        run: npm test --if-present
      # Bloquea solo por las dependencias que van en la imagen (producción).
      # Las de desarrollo no llegan al contenedor; hoy picomatch (vía vitest) tiene un aviso
      # alto sin versión corregida, y bloquear por él dejaría el CI en rojo sin nada que arreglar.
      - name: Auditoría de dependencias (producción)
        if: steps.detectar.outputs.hay == 'true'
        run: npm audit --omit=dev --audit-level=high
      # Auditoría completa, informativa: se ve en el CI pero no lo detiene.
      # Revisar en cada actualización de dependencias si ya hay arreglo.
      - name: Auditoría de dependencias (completa, no bloquea)
        if: steps.detectar.outputs.hay == 'true'
        continue-on-error: true
        run: npm audit --audit-level=high
      # El chequeo de que el OpenAPI generado coincide con el commiteado corre dentro de `npm test` (D-033)
      # PENDIENTE (M8): Trivy sobre las imágenes de Docker

  integracion:
    name: Integración (PostgreSQL y migraciones)
    runs-on: ubuntu-latest
    # Base desechable solo para este trabajo; usuario y contraseña de prueba, sin valor fuera del CI.
    services:
      postgres:
        image: postgres:17.12-alpine3.24
        env:
          POSTGRES_DB: correobajolupa_test
          POSTGRES_USER: cbl_test
          POSTGRES_PASSWORD: cbl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cbl_test -d correobajolupa_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://cbl_test:cbl_test@localhost:5432/correobajolupa_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Validar el esquema de Prisma
        run: npm run db:validate
      - name: Aplicar las migraciones
        run: npx prisma migrate deploy
      - name: Comprobar que el esquema y las migraciones coinciden
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      # test:int vuelve a vaciar la base y aplica las migraciones desde cero antes de las pruebas.
      - name: Pruebas de integración
        run: npm run test:int
