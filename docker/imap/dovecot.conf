# Dovecot del laboratorio IMAP de CorreoBajoLupa (D-043). Configuración autónoma: no incluye conf.d.
# Sin contraseñas aquí: el archivo de usuarios lo arma arranque.sh al iniciar, con el hash.

protocols = imap
listen = *

# Sin root: el maestro y todos sus procesos corren como vmail (uid 5000). Por eso no hay chroot
# en los procesos de login (hacer chroot requiere root).
base_dir = /run/dovecot
state_dir = /var/lib/dovecot
default_internal_user = vmail
default_internal_group = vmail
default_login_user = vmail
first_valid_uid = 5000
last_valid_uid = 5000

# Registros a la salida estándar del contenedor. Nunca contraseñas ni detalles de autenticación.
log_path = /dev/stderr
info_log_path = /dev/stderr
auth_verbose = no
auth_verbose_passwords = no
auth_debug = no
auth_debug_passwords = no
mail_debug = no

# Sin TLS, a propósito: el puerto 143 solo existe dentro de la red imap-net de Docker y no se
# publica al host (ver README). Por eso se permite el login en texto plano dentro de esa red.
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login

# Usuarios: student, teacher y staff @lab.example (D-015). El mismo archivo sirve de passdb y de
# userdb, así un usuario que no está en él no existe para Dovecot.
passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT username_format=%u /run/dovecot-lab/users
}
userdb {
  driver = passwd-file
  args = username_format=%u /run/dovecot-lab/users
}

# Maildir dentro del volumen imap-data: los mensajes y el UIDVALIDITY sobreviven a un reinicio.
mail_location = maildir:/var/vmail/%d/%n/Maildir

namespace inbox {
  inbox = yes
  separator = /
  # INBOX y Cuarentena se crean y se suscriben solas para cada usuario. La restricción de
  # Cuarentena (ACL, nº 2) llega en M7.
  mailbox INBOX {
    auto = subscribe
  }
  mailbox Cuarentena {
    auto = subscribe
  }
}

service imap-login {
  chroot =
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 0
  }
}

service anvil {
  chroot =
}
