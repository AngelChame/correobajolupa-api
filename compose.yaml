# Pila de CorreoBajoLupa (RNF-23). M0: PostgreSQL, migraciones y la API; M1: volumen de reportes y
# worker de análisis (cola en PostgreSQL, D-054); M2: ClamAV para los adjuntos; M4: Dovecot, el
# servidor IMAP del laboratorio (D-043).
# Front (D-031) con el perfil web: docker compose --profile web up -d --build (ver README).
# Llega después: el proxy con HTTPS (nº 28).
# Uso: cp .env.example .env  →  cambia las contraseñas  →  docker compose up -d --build

name: correobajolupa

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Archivos de reportes (D-038). Lo montan la API y, cuando llegue, el worker, en la misma ruta
# que STORAGE_DIR. Nadie más: ni la base ni el front lo ven.
x-reports-volume: &reports-volume reports-data:/data/reports

services:
  db:
    image: postgres:17.12-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-correobajolupa}
      POSTGRES_USER: ${POSTGRES_USER:-correobajolupa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Sin puertos publicados: solo la API llega a la base por la red interna.
    restart: unless-stopped
    logging: *logging

  # Aplica las migraciones pendientes y termina. La API no arranca hasta que salga con 0.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-correobajolupa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-correobajolupa}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  api:
    build:
      context: .
      target: runtime
    # Solo las variables que la API usa hoy; el resto del .env no entra al contenedor.
    # Se agregan aquí conforme llegan los módulos. ClamAV no: solo lo usa el worker.
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-correobajolupa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-correobajolupa}
      # Con NODE_ENV=production la API no arranca si COOKIE_SECURE=false.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Primer administrador (opcionales, en pareja) y código de invitación (vacío = registro abierto).
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-}
      INVITE_CODE: ${INVITE_CODE:-}
      # Límites de peticiones; vacíos toman los valores por defecto de src/config.ts.
      RATE_LIMIT_REGISTER_PER_IP: ${RATE_LIMIT_REGISTER_PER_IP:-}
      RATE_LIMIT_REGISTER_WINDOW_MIN: ${RATE_LIMIT_REGISTER_WINDOW_MIN:-}
      RATE_LIMIT_LOGIN_PER_IP: ${RATE_LIMIT_LOGIN_PER_IP:-}
      RATE_LIMIT_LOGIN_FAILS_PER_EMAIL: ${RATE_LIMIT_LOGIN_FAILS_PER_EMAIL:-}
      RATE_LIMIT_LOGIN_WINDOW_MIN: ${RATE_LIMIT_LOGIN_WINDOW_MIN:-}
      # Límite global por IP en /api/v1 (salvo /health). Sin proxy todos comparten IP (D-048).
      RATE_LIMIT_GLOBAL_PER_MINUTE: ${RATE_LIMIT_GLOBAL_PER_MINUTE:-}
      # Saltos de proxy de confianza: 0 mientras no haya proxy delante (nº 28).
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      # M1: reportes. STORAGE_DIR es fija: tiene que coincidir con el punto de montaje del volumen.
      STORAGE_DIR: /data/reports
      MAX_EML_BYTES: ${MAX_EML_BYTES:-}
      MAX_PASTE_BYTES: ${MAX_PASTE_BYTES:-}
      REPORTS_PER_USER_PER_HOUR: ${REPORTS_PER_USER_PER_HOUR:-}
      INSTITUTIONAL_DOMAINS: ${INSTITUTIONAL_DOMAINS:-}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-}
    volumes:
      - *reports-volume
    # default: la base. imap-net: el IMAP del laboratorio (lo usan los pasos siguientes de M4).
    # Sin depends_on de imap: el modo real no depende del laboratorio (D-003); si el IMAP no está,
    # las rutas del laboratorio responderán 503.
    networks: [default, imap-net]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Solo en la propia máquina; en la instancia, el proxy (nº 28) publicará 80 y 443.
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    # Arranca sola cuando la instancia del Learner Lab se reinicia (D-009).
    restart: unless-stopped
    logging: *logging

  # Worker de análisis (D-054): misma imagen que la API, otro comando. Toma reportes de la tabla
  # reports (FOR UPDATE SKIP LOCKED) y lee sus archivos del mismo volumen. Sin puertos.
  worker:
    build:
      context: .
      target: runtime
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-correobajolupa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-correobajolupa}
      STORAGE_DIR: /data/reports
      INSTITUTIONAL_DOMAINS: ${INSTITUTIONAL_DOMAINS:-}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-}
      CLEANUP_INTERVAL_MIN: ${CLEANUP_INTERVAL_MIN:-}
      # M2: ClamAV por la red clamav-net. Vacíos = valores por defecto de src/config.ts.
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:-}
      CLAMAV_TOTAL_BUDGET_MS: ${CLAMAV_TOTAL_BUDGET_MS:-}
      CLAMAV_MAX_SCAN_BYTES: ${CLAMAV_MAX_SCAN_BYTES:-}
      MAX_ATTACHMENTS_SCANNED: ${MAX_ATTACHMENTS_SCANNED:-}
    volumes:
      - *reports-volume
    # default: la base. clamav-net: solo el worker y ClamAV. imap-net: el IMAP del laboratorio
    # (sin depends_on de imap: el análisis del modo real no lo espera, D-003).
    networks: [default, clamav-net, imap-net]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Solo que el contenedor exista, no que esté sano: si ClamAV está caído o todavía cargando
      # firmas, el worker sigue y marca los adjuntos como error (P-05), nunca como limpios.
      clamav:
        condition: service_started
    # La imagen trae el healthcheck HTTP de la API; el worker no escucha en ningún puerto.
    healthcheck:
      disable: true
    # Tiempo para terminar el análisis en curso tras SIGTERM (el worker sale solo a los 25 s).
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *logging

  # Antivirus para los adjuntos (M2, D-018). El worker le manda cada adjunto por TCP (INSTREAM);
  # nada se escribe a disco. Imagen oficial con versión exacta (1.5.5: parche de seguridad).
  # Necesita al menos 3 GiB de RAM; el primer arranque descarga las firmas y tarda varios minutos.
  # Sin puertos publicados y fuera de la red default: solo el worker llega a él. clamav-net no es
  # "internal" porque freshclam necesita salir a internet para actualizar las firmas.
  clamav:
    image: clamav/clamav:1.5.5
    environment:
      # Sin milter: aquí solo se usa clamd.
      CLAMAV_NO_MILTERD: "true"
    volumes:
      - clamav-db:/var/lib/clamav
    networks: [clamav-net]
    restart: unless-stopped
    logging: *logging

  # Servidor IMAP del laboratorio (M4, D-043): Dovecot 2.3 sobre Ubuntu 22.04 (docker/imap/).
  # Tres buzones sintéticos (D-015): student, teacher y staff @lab.example, con la misma contraseña
  # IMAP_LAB_PASSWORD (16 caracteres o más). Sin ella, o si es corta, solo este contenedor se niega a
  # arrancar (lo valida arranque.sh); el resto de la pila funciona. Puerto 143 sin TLS solo dentro de
  # imap-net: sin puertos publicados al host. Mensajes y UIDVALIDITY en el volumen imap-data.
  imap:
    build:
      context: ./docker/imap
    environment:
      IMAP_LAB_PASSWORD: ${IMAP_LAB_PASSWORD:-}
    volumes:
      - imap-data:/var/vmail
    # Sistema de archivos de solo lectura, sin capacidades de Linux y sin escalar privilegios:
    # Dovecot corre como vmail y solo escribe en el volumen y en estas carpetas en memoria.
    read_only: true
    tmpfs:
      - /run/dovecot:uid=5000,gid=5000,mode=0755
      - /run/dovecot-lab:uid=5000,gid=5000,mode=0700
      - /var/lib/dovecot:uid=5000,gid=5000,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [imap-net]
    # El healthcheck viene en la imagen (salud.sh): saludo en el 143 y base de usuarios.
    restart: unless-stopped
    logging: *logging

  # Front de Cesar (D-031): nginx sirve la SPA y reenvía /api/* a la API (mismo origen, D-052).
  # Solo con --profile web; sin el repo al lado, el Compose normal no lo necesita.
  # Con este perfil, la API debe confiar en UN salto de proxy: TRUST_PROXY_HOPS=1 en el .env
  # (ver README; nunca true).
  web:
    profiles: [web]
    build:
      context: ${WEB_REPO_DIR:-../correobajolupa-web}
    environment:
      API_UPSTREAM: api:3000
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  # Base efímera para `npm run test:int` (solo con --profile test; no arranca con la pila).
  # Datos en memoria: se pierden al detenerla. Usuario y contraseña de prueba, solo en esta máquina.
  db-test:
    profiles: [test]
    image: postgres:17.12-alpine3.24
    environment:
      POSTGRES_DB: correobajolupa_test
      POSTGRES_USER: cbl_test
      POSTGRES_PASSWORD: cbl_test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbl_test -d correobajolupa_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  # `npm run test:int:docker`: las pruebas de integración dentro de Linux (como el CI), contra
  # db-test. Imagen: etapa deps del Dockerfile (node:24.22.3-bookworm-slim con openssl para Prisma).
  # El código se monta de la máquina; node_modules y el cliente generado de Prisma van en volúmenes
  # propios, así nunca se usan ni se pisan los de Windows.
  test-int:
    profiles: [test]
    build:
      context: .
      target: deps
    working_dir: /app
    volumes:
      - .:/app
      - test-node-modules:/app/node_modules
      - test-prisma-generated:/app/src/generated
    environment:
      DATABASE_URL: postgresql://cbl_test:cbl_test@db-test:5432/correobajolupa_test
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx prisma generate && npm run test:int"]
    depends_on:
      db-test:
        condition: service_healthy

  # `npm run test:imap:docker`: prueba de humo contra el Dovecot del laboratorio, desde dentro de
  # imap-net (el 143 no se publica al host). default solo sirve para que npm ci descargue paquetes.
  test-imap:
    profiles: [test]
    build:
      context: .
      target: deps
    working_dir: /app
    volumes:
      - .:/app
      - test-node-modules:/app/node_modules
    environment:
      IMAP_LAB_SMOKE: "1"
      IMAP_LAB_HOST: imap
      IMAP_LAB_PORT: "143"
      IMAP_LAB_PASSWORD: ${IMAP_LAB_PASSWORD:-}
    networks: [default, imap-net]
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx vitest run test/imap-smoke.test.ts"]
    depends_on:
      imap:
        condition: service_healthy

  # `npm run lab:seed`: siembra los 21 mensajes sintéticos de test/fixtures/lab en los buzones del
  # laboratorio (APPEND a INBOX; idempotente). Solo con --profile tools; corre dentro de imap-net
  # porque el 143 no se publica. El repo se monta de solo lectura.
  lab-seed:
    profiles: [tools]
    build:
      context: .
      target: deps
    working_dir: /app
    volumes:
      - .:/app:ro
      - test-node-modules:/app/node_modules
    environment:
      IMAP_LAB_HOST: imap
      IMAP_LAB_PORT: "143"
      IMAP_LAB_PASSWORD: ${IMAP_LAB_PASSWORD:-}
    networks: [default, imap-net]
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx tsx src/lab/seed.ts"]
    depends_on:
      imap:
        condition: service_healthy
    restart: "no"

networks:
  default:
  clamav-net:
  # internal: el IMAP del laboratorio no sale a internet; la API y el worker sí, por default.
  imap-net:
    internal: true

volumes:
  db-data:
  reports-data:
  # Firmas de ClamAV: sobreviven a reinicios y no se descargan de nuevo cada vez.
  clamav-db:
  # Buzones del laboratorio (Maildir): sobreviven a reinicios con el mismo UIDVALIDITY.
  imap-data:
  test-node-modules:
  test-prisma-generated:
